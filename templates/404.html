{% extends "base.html" %}
{% block title %}Page not found | AgriRent{% endblock %}
{% block content %}
<section class="mx-auto max-w-3xl px-4 py-24 text-center sm:px-6">
    <span class="inline-flex h-20 w-20 items-center justify-center rounded-3xl bg-green-50 text-4xl">🌱</span>
    <p class="mt-7 text-sm font-extrabold uppercase tracking-[0.2em] text-green-700">Error 404</p>
    <h1 class="mt-3 text-4xl font-extrabold tracking-tight text-slate-900">We couldn't find that page.</h1>
    <p class="mx-auto mt-4 max-w-lg leading-7 text-slate-500">The page or record may have been removed, or you may not have access to it.</p>
    <a href="{{ url_for('index') }}" class="mt-7 inline-flex rounded-xl bg-green-600 px-6 py-3 font-bold text-white shadow-md hover:bg-green-700">Return home</a>
</section>
{% endblock %}
